<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>CopySelect</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="responsive.css"><link rel="stylesheet" href="accessibility.css"></head>
<body class="popup"><div class="pop">
<header class="pop-head"><div class="brand"><img src="icon_48.png" alt=""><span class="pop-brand-lockup"><span>COPYS<span class="brand-slash">/</span>LECT</span><small>local-first</small></span><span class="pop-version version-tip" tabindex="0">3.7.8.20</span></div><div class="pop-head-actions"><select id="profile" aria-label="Profile"></select><button id="settingsTop" class="pop-settings" title="Open settings" aria-label="Open settings">⚙</button></div></header>
<section class="pop-hero"><div class="site-identity"><span class="pop-kicker">Working on</span><b id="siteHost">Current site</b><span id="masterLabel" role="status" aria-live="polite">Automatic copy is on</span></div><label class="master-wrap"><input id="master" class="toggle" type="checkbox" aria-label="Enable CopySelect"></label></section>
<section id="pageConnection" class="page-connection" aria-live="polite"><span>Page connection</span><b id="pageConnectionStatus">Checking…</b><button id="reconnectPage" type="button" class="hidden">Reconnect</button></section>
<main class="pop-body">
  <section class="pop-control-group" aria-label="Quick controls">
    <label class="pop-row pop-primary"><span><b>Copy as</b><small>Output format</small></span><select id="copyMode"><option value="plain">Plain Text</option><option value="original">Rich Text</option><option value="markdown">Markdown Link</option><option value="quote-source">Quote + Source</option><option value="url-title">Text + Reference + Date</option><option value="custom">Make your own template...</option></select></label>
    <div class="pop-quick-grid"><label><span>This site</span><select id="siteBehavior"><option value="inherit">Use default</option><option value="enable">Always on</option><option value="disable">Always off</option></select></label><label><span>Effect</span><select id="quickEffect"><option value="selection-flash">Flash</option><option value="selection-brackets">Brackets</option><option value="soft-halo">Soft halo</option><option value="underline-sweep">Underline</option><option value="none">None</option></select></label></div>
    <label class="pop-row"><span>Confirmation</span><select id="notify"><option value="none">None</option><option value="visual">Visual</option><option value="sound">Sound</option><option value="visual-sound">Visual + sound</option></select></label>
    <label class="pop-row pop-delay"><span>Delay</span><span><input id="delay" type="number" min="0" max="10000" aria-label="Copy delay in milliseconds"><em>ms</em></span></label>
    <label class="pop-row"><span><b>History saving</b><small>Pause saving without pausing copying</small></span><select id="historyPause"><option value="resume">Saving normally</option><option value="15">Don’t save for 15 min</option><option value="60">Don’t save for 1 hour</option><option value="restart">Don’t save until restart</option></select></label>
  </section>

  <section class="pop-working" aria-label="Working now"><div class="pop-section-head"><b>Working now</b><span id="wordWatchStatus" class="tiny">WordWatch</span></div><div class="pop-working-grid"><button id="popupPasteStack" type="button"><b>Paste Stack <span id="popupPasteStackCount">0</span></b><small>Copy next queued item</small></button><button id="popupCollections" type="button"><b>Collections</b><small>Tags · Saved Views · WordWatch</small></button><button id="popupPinLast" type="button"><b>Pin last copy</b><small>Keep it handy</small></button></div><div id="popupLastMatch" class="pop-last-match hidden"></div></section>
  <section class="pop-recent"><div class="pop-section-head"><b>Recent copies</b><button id="viewHistory" title="Open complete history" aria-label="Open complete history">↗</button></div><div id="recentList" class="recent-list"><div class="tiny">Nothing copied yet.</div></div></section>
</main>
<footer class="pop-footer"><label id="pauseControl" class="pause-control"><span>Pause</span><select id="pause" aria-label="Pause CopySelect"><option value="resume">Not paused</option><option value="5">5 minutes</option><option value="30">30 minutes</option><option value="60">1 hour</option><option value="restart">Until restart</option></select></label><button id="history">Open history</button><span class="local-badge">● Local</span></footer>
</div><div id="popupStatus" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div><div id="popupError" class="sr-only" role="alert" aria-live="assertive" aria-atomic="true"></div><script src="smart-core.js"></script><script src="settings.js"></script><script src="popup.js"></script></body></html>
